services:
  postgres:
    image: postgres:13
    env_file: ../.env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invatur

  backend:
    image: invatur-backend:local
    restart: unless-stopped
    build:
      context: ../.
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      - ../.env
    networks:
      - invatur
    command: >
      gunicorn app.main:app 
      --workers 1 --worker-class uvicorn.workers.UvicornWorker
      --bind=0.0.0.0:8001 
      --forwarded-allow-ips '*'
      --access-logfile="-" 
      --error-logfile="-"

  bot:
    image: invatur-backend:local
    restart: unless-stopped
    build:
      context: ../.
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      - ../.env
    networks:
      - invatur
    command: python bot/main.py

volumes:
  postgres_data:

networks:
  invatur:
